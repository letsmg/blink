<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fundo circular gradiente verde/teal -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="white" stroke-width="2"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Ícone de olho (eye) -->
  <g transform="translate(50,50)">
    <!-- Olho externo -->
    <path d="M-30,0 C-30,-15 -15,-25 0,-25 C15,-25 30,-15 30,0 C30,15 15,25 0,25 C-15,25 -30,15 -30,0 Z"
          stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pupila -->
    <circle cx="0" cy="0" r="8" fill="white"/>
    <!-- Brilho na pupila -->
    <circle cx="-3" cy="-3" r="3" fill="#059669"/>
  </g>
  <!-- Linha de piscada (blink line) - 4 tracinhos laterais -->
  <line x1="25" y1="40" x2="15" y2="40" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="25" y1="46" x2="15" y2="46" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="75" y1="40" x2="85" y2="40" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="75" y1="46" x2="85" y2="46" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>