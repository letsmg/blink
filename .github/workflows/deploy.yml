name: 🚀 CI/CD Deploy Atômico Blink

on:
  push:
    branches: [hom, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Configurar PHP (Para ferramentas no Runner)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, pgsql, pdo_pgsql

      - name: 📦 Instalar dependências do Composer (Modo Produção)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 Configurar Node.js (Para os assets/frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Instalar dependências do Node e Rodar Builds do Vite
        run: |
          npm ci
          npm run build

      - name: 🤐 Criar Pacote de Deploy Compactado (Pronto para Uso)
        run: |
          mkdir build-tmp

          # Inclui as pastas essenciais do projeto Laravel + Build do Vite
          cp -r app bootstrap config database public resources routes storage vendor build-tmp/

          # Copia os arquivos vitais da raiz do projeto
          cp artisan composer.json package.json build-tmp/

          # Remove o link gerado localmente para evitar conflito com o link simbólico atômico do servidor
          rm -rf build-tmp/public/storage
          rm -f build-tmp/public/hot

          # Compacta o pacote limpo
          cd build-tmp
          zip -r ../deploy-blink.zip .
          cd ..

      - name: 🔑 Configurar Chave SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: 🚀 Transferir Pacote e Executar Deploy Atômico no Servidor
        run: |
          SERVER_IP="${{ secrets.SERVER_IP }}"
          BRANCH_NAME="${{ github.ref_name }}"

          # Define o diretório base com base na branch (hom -> dev-blink | main -> blink)
          if [ "$BRANCH_NAME" = "main" ]; then
            TARGET_DIR="/var/www/blink"
            ENV_FILE=".env.production"
          else
            TARGET_DIR="/var/www/dev-blink"
            ENV_FILE=".env.development"
          fi

          echo "🎯 Alvo do Deploy: $TARGET_DIR (Branch: $BRANCH_NAME)"

          # Envia o arquivo zip para a pasta tmp do servidor via SCP
          scp -o StrictHostKeyChecking=no deploy-blink.zip ubuntu@$SERVER_IP:/tmp/

          # Executa o script atômico via SSH
          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_IP << EOF
            set -e

            BASE_DIR="$TARGET_DIR"
            RELEASES_DIR="\$BASE_DIR/releases"
            SHARED_DIR="\$BASE_DIR/shared"
            CURRENT_DIR="\$BASE_DIR/current"
            RELEASE_NAME="\$(date +%Y%m%d%H%M%S)"
            NEW_RELEASE_DIR="\$RELEASES_DIR/\$RELEASE_NAME"

            # 1. Garante que o unzip está instalado
            if ! command -v unzip &> /dev/null; then
                sudo apt-get update -y && sudo apt-get install unzip -y
            fi

            # 2. Cria a estrutura atômica básica se não existir
            sudo mkdir -p "\$RELEASES_DIR" "\$SHARED_DIR/storage" "\$SHARED_DIR/bootstrap/cache"

            # 3. Garante que o arquivo de ambiente compartilhado (.env) existe no shared
            if [ ! -f "\$SHARED_DIR/.env" ]; then
                echo "⚠️ Arquivo .env não encontrado em shared/. Criando estrutura padrão..."
                sudo touch "\$SHARED_DIR/.env"
            fi

            # 4. Cria a nova pasta para esta release específica
            sudo mkdir -p "\$NEW_RELEASE_DIR"

            # 5. Descompacta o pacote na nova release
            echo "📂 Descompactando pacote na release \$RELEASE_NAME..."
            sudo unzip -o /tmp/deploy-blink.zip -d "\$NEW_RELEASE_DIR"

            # 6. Conecta os arquivos compartilhados (/shared/.env e /shared/storage) via links simbólicos
            echo "🔗 Configurando links compartilhados (Shared & Storage)..."
            
            # Garante que as pastas essenciais existem no shared com permissão total
            sudo mkdir -p "\$SHARED_DIR/storage/app/public"
            sudo mkdir -p "\$SHARED_DIR/storage/framework/cache"
            sudo mkdir -p "\$SHARED_DIR/storage/framework/sessions"
            sudo mkdir -p "\$SHARED_DIR/storage/framework/views"
            sudo mkdir -p "\$SHARED_DIR/storage/logs"
            sudo mkdir -p "\$SHARED_DIR/bootstrap/cache"

            # Remove o .env que veio no zip e aponta para o do shared
            sudo rm -f "\$NEW_RELEASE_DIR/.env"
            sudo ln -s "\$SHARED_DIR/.env" "\$NEW_RELEASE_DIR/.env"

            # Remove a pasta storage da release e aponta para o shared/storage persistente ANTES de QUALQUER artisan
            sudo rm -rf "\$NEW_RELEASE_DIR/storage"
            sudo ln -s "\$SHARED_DIR/storage" "\$NEW_RELEASE_DIR/storage"

            # Remove o bootstrap/cache local e aponta para o shared
            sudo rm -rf "\$NEW_RELEASE_DIR/bootstrap/cache"
            sudo ln -s "\$SHARED_DIR/bootstrap/cache" "\$NEW_RELEASE_DIR/bootstrap/cache"

            # 7. Garante permissão total do www-data no diretório shared e na release atual
            sudo chown -R www-data:www-data "\$SHARED_DIR"
            sudo chown -R www-data:www-data "\$NEW_RELEASE_DIR"
            sudo chmod -R 775 "\$SHARED_DIR"

            # 7. Ajusta permissões iniciais para o www-data rodar o artisan
            sudo chown -R www-data:www-data "\$NEW_RELEASE_DIR"
            sudo chmod -R 775 "\$SHARED_DIR/storage" "\$SHARED_DIR/bootstrap/cache"

            # 8. Executa comandos do Laravel na nova release
            echo "⚙️ Executando otimizações e migrações..."
            cd "\$NEW_RELEASE_DIR"

            sudo -u www-data php artisan config:clear
            sudo -u www-data php artisan route:clear

            # Migrações e Seeders (Forçados no ambiente)
            sudo -u www-data php artisan migrate --force
            sudo -u www-data php artisan db:seed --force

            # Link simbólico absoluto oficial do storage para a pasta public
            # (Remove o link padrão se existir e aponta de forma absoluta para o shared/storage/app/public)
            sudo rm -rf "\$NEW_RELEASE_DIR/public/storage"
            sudo ln -s "\$SHARED_DIR/storage/app/public" "\$NEW_RELEASE_DIR/public/storage"

            # Otimizações de Produção
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan view:cache

            # 9. Troca atômica do link simbólico 'current' para apontar para a nova release
            echo "🔄 Realizando a troca atômica (symlink current)..."
            sudo ln -sfn "\$NEW_RELEASE_DIR" "\$CURRENT_DIR"

            # 10. Governança e Limpeza de Releases Antigas (Mantém apenas as últimas 5)
            echo "🧹 Limpando releases antigas (mantendo as 5 mais recentes)..."
            cd "\$RELEASES_DIR"
            sudo ls -t | tail -n +6 | xargs -I {} sudo rm -rf {} || true

            # Limpa arquivo temporário
            rm -f /tmp/deploy-blink.zip

            echo "✅ Deploy atômico finalizado com sucesso para \$TARGET_DIR!"
          EOF

      - name: 🧹 Limpar Runner do GitHub
        if: always()
        run: rm -rf build-tmp deploy-blink.zip