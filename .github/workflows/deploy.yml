name: 🚀 Build & Deploy Blink (Atômico & Ambientes)

on:
  push:
    branches: [main, hom]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, gd, zip, pgsql

      - name: 📦 Install Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Build Frontend (Vite)
        run: |
          npm install
          npm run build

      - name: 🤐 Criar Pacote de Deploy
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x ".github/*" \
            -x "tests/*" \
            -x ".env*" \
            -x "storage/framework/*" \
            -x "storage/logs/*"

      - name: 🔑 Configure SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: 🚀 Deploy Atômico com Versões Sequenciais
        run: |
          SERVER_IP="${{ secrets.SERVER_IP }}"
          BRANCH_NAME="${{ github.ref_name }}"

          # Define a pasta raiz com base no branch solicitado
          if [ "$BRANCH_NAME" = "main" ]; then
            TARGET_ROOT="/var/www/blink"
            ENV_LABEL="prod"
          else
            TARGET_ROOT="/var/www/blink-hom"
            ENV_LABEL="hom"
          fi

          echo "Target Path: $TARGET_ROOT (Branch: $BRANCH_NAME)"

          scp -o StrictHostKeyChecking=no deploy.zip ubuntu@$SERVER_IP:/tmp/blink-deploy-${ENV_LABEL}.zip

          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_IP << EOF
            set -e

            ROOT_PATH="${TARGET_ROOT}"
            RELEASES_PATH="\${ROOT_PATH}/releases"
            SHARED_PATH="\${ROOT_PATH}/shared"
            CURRENT_LINK="\${ROOT_PATH}/current"

            DATE_PREFIX=\$(date +%Y%m%d%H%M%S)

            echo "📦 Criando estrutura em \${ROOT_PATH}..."

            sudo mkdir -p \${RELEASES_PATH}
            sudo mkdir -p \${SHARED_PATH}/storage/framework/cache
            sudo mkdir -p \${SHARED_PATH}/storage/framework/sessions
            sudo mkdir -p \${SHARED_PATH}/storage/framework/views
            sudo mkdir -p \${SHARED_PATH}/storage/logs
            sudo mkdir -p \${SHARED_PATH}/storage/app/public

            if [ ! -f "\${SHARED_PATH}/.env" ]; then
              echo "❌ Arquivo shared/.env não encontrado em \${SHARED_PATH}"
              exit 1
            fi

            echo "🔢 Calculando número sequencial da release..."
            cd \${RELEASES_PATH}
            
            # Pega a última pasta criada no geral
            LAST_DIR=\$(ls -d *-* 2>/dev/null | sort | tail -n 1)
            
            if [ -z "\${LAST_DIR}" ]; then
              NEXT_SEQ="001"
            else
              LAST_SEQ=\$(echo \${LAST_DIR} | awk -F'-' '{print \$NF}')
              # Remove zeros à esquerda para evitar erro de octal e soma 1
              CLEAN_SEQ=\$(echo \${LAST_SEQ} | sed 's/^0*//')
              if [ -z "\${CLEAN_SEQ}" ] || [ "\${CLEAN_SEQ}" = "" ]; then
                CLEAN_SEQ=0
              fi
              NEXT_VAL=\$((CLEAN_SEQ + 1))
              NEXT_SEQ=\$(printf "%03d" \${NEXT_VAL})
            fi

            RELEASE_NAME="\${DATE_PREFIX}-\${NEXT_SEQ}"
            NEW_RELEASE="\${RELEASES_PATH}/\${RELEASE_NAME}"

            echo "📦 Criando nova release: \${RELEASE_NAME}"

            sudo mkdir -p \${NEW_RELEASE}
            sudo unzip -oq /tmp/blink-deploy-${ENV_LABEL}.zip -d \${NEW_RELEASE}

            echo "⚙️ Configurando o Docker Compose correto para o ambiente (${ENV_LABEL})..."
            cd \${NEW_RELEASE}
            
            # Garante que o usuário ubuntu tem permissão de escrita temporária nesta pasta
            sudo chown -R ubuntu:ubuntu \${NEW_RELEASE}

            if [ "${ENV_LABEL}" = "prod" ]; then
              if [ -f "docker-compose.prod.yml" ]; then
                cp docker-compose.prod.yml docker-compose.yml
              elif [ -f "docker/docker-compose.prod.yml" ]; then
                cp docker/docker-compose.prod.yml docker-compose.yml
              elif [ -f "docker-compose.yml" ]; then
                cp docker-compose.yml docker-compose.yml
              else
                echo "❌ AVISO: Nenhum docker-compose de produção foi encontrado!"
                exit 1
              fi
            else
              if [ -f "docker-compose.hom.yml" ]; then
                cp docker-compose.hom.yml docker-compose.yml
              elif [ -f "docker/docker-compose.hom.yml" ]; then
                cp docker/docker-compose.hom.yml docker-compose.yml
              elif [ -f "docker-compose.yml" ]; then
                cp docker-compose.yml docker-compose.yml
              else
                echo "❌ AVISO: Nenhum docker-compose de homologação foi encontrado!"
                exit 1
              fi
            fi

            echo "📄 Arquivo docker-compose final gerado com sucesso:"
            ls -la docker-compose.yml

            echo "🛑 Parando containers antigos antes de subir a nova versão..."
            if [ -d "\${CURRENT_LINK}/docker" ] && [ -f "\${CURRENT_LINK}/docker/docker-compose.yml" ]; then
              cd \${CURRENT_LINK}/docker && docker compose --env-file \${SHARED_PATH}/.env down --remove-orphans || true
            elif [ -f "\${CURRENT_LINK}/docker-compose.yml" ]; then
              cd \${CURRENT_LINK} && docker compose --env-file \${SHARED_PATH}/.env down --remove-orphans || true
            fi

            echo "🐳 Subindo containers Docker na nova release..."
            cd \${NEW_RELEASE}
            if [ -f "docker-compose.yml" ]; then
              docker compose --env-file \${SHARED_PATH}/.env up -d --build --remove-orphans
            fi

            echo "🖼️ Sincronizando uploads..."
            if [ -d "\${NEW_RELEASE}/storage/app/public" ]; then
              sudo cp -R \${NEW_RELEASE}/storage/app/public/. \${SHARED_PATH}/storage/app/public/ || true
            fi

            echo "🔗 Criando links simbólicos..."
            sudo ln -sfn \${SHARED_PATH}/.env \${NEW_RELEASE}/.env

            sudo rm -rf \${NEW_RELEASE}/storage
            sudo ln -sfn \${SHARED_PATH}/storage \${NEW_RELEASE}/storage

            sudo rm -rf \${NEW_RELEASE}/public/storage
            sudo ln -sfn \${SHARED_PATH}/storage/app/public \${NEW_RELEASE}/public/storage

            echo "🔐 Ajustando permissões..."
            sudo chown -R ubuntu:www-data \${ROOT_PATH}
            sudo chmod -R 775 \${SHARED_PATH}/storage
            sudo chmod -R 775 \${NEW_RELEASE}/bootstrap/cache

            cd \${NEW_RELEASE}

            echo "🧹 Limpando caches..."
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear || true
            php artisan cache:clear || true

            echo "🗄️ Executando migrations..."
            php artisan migrate --force
            php artisan db:seed --force
            
            echo "⚡ Gerando caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔀 Realizando swap atômico..."
            sudo ln -sfn \${NEW_RELEASE} \${CURRENT_LINK}

            echo "🧹 Removendo releases antigas..."
            cd \${RELEASES_PATH}
            ls -t | tail -n +4 | xargs -r sudo rm -rf --

            sudo rm -f /tmp/blink-deploy-${ENV_LABEL}.zip

            echo "✅ Deploy concluído com sucesso em \${ROOT_PATH}!"
          EOF