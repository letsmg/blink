name: 🚀 Build & Deploy Blink (Atômico & Ambientes)

on:
  push:
    branches: [main, hom]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, gd, zip, pgsql

      - name: 📦 Install Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Build Frontend (Vite)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 🤐 Criar Pacote de Deploy
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x ".github/*" \
            -x "tests/*" \
            -x ".env*" \
            -x "storage/framework/*" \
            -x "storage/logs/*"

      - name: 🔑 Configure SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: 🚀 Deploy Atômico com Versões Sequenciais
        run: |
          SERVER_IP="${{ secrets.SERVER_IP }}"
          BRANCH_NAME="${{ github.ref_name }}"

          if [ "$BRANCH_NAME" = "main" ]; then
            TARGET_ROOT="/var/www/blink"
            ENV_LABEL="prod"
          else
            TARGET_ROOT="/var/www/blink-hom"
            ENV_LABEL="hom"
          fi

          echo "Target Path: $TARGET_ROOT (Branch: $BRANCH_NAME)"

          scp -o StrictHostKeyChecking=no deploy.zip ubuntu@$SERVER_IP:/tmp/blink-deploy-${ENV_LABEL}.zip

          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_IP "TARGET_ROOT='${TARGET_ROOT}' ENV_LABEL='${ENV_LABEL}' bash -s" << 'EOF'
            set -e
            set -x

            ROOT_PATH="${TARGET_ROOT}"
            RELEASES_PATH="${ROOT_PATH}/releases"
            SHARED_PATH="${ROOT_PATH}/shared"
            CURRENT_LINK="${ROOT_PATH}/current"

            echo "📦 Criando estrutura em ${ROOT_PATH}..."

            sudo mkdir -p "${RELEASES_PATH}"
            sudo mkdir -p "${SHARED_PATH}/storage/framework/cache"
            sudo mkdir -p "${SHARED_PATH}/storage/framework/sessions"
            sudo mkdir -p "${SHARED_PATH}/storage/framework/views"
            sudo mkdir -p "${SHARED_PATH}/storage/logs"
            sudo mkdir -p "${SHARED_PATH}/storage/app/public"

            sudo chmod -R 777 "${SHARED_PATH}/storage"
            sudo chown -R ubuntu:www-data "${SHARED_PATH}/storage"

            if [ ! -f "${SHARED_PATH}/.env" ]; then
              echo "❌ Arquivo shared/.env não encontrado em ${SHARED_PATH}"
              exit 1
            fi

            echo "🔢 Calculando número sequencial da release..."
            cd "${RELEASES_PATH}"

            LAST_SEQ=$(
                find . -maxdepth 1 -mindepth 1 -type d \
                | sed 's#^\./##' \
                | grep -E -- '-[0-9]{3}$' \
                | awk -F'-' '{print $(NF)}' \
                | sort -n \
                | tail -1
            )

            if [ -z "${LAST_SEQ}" ]; then
              LAST_SEQ="000"
            fi

            LAST_SEQ_NUMBER=$((10#${LAST_SEQ}))
            NEXT_NUMBER=$((LAST_SEQ_NUMBER + 1))
            NEXT_SEQ=$(printf "%03d" "${NEXT_NUMBER}")

            DATE_PREFIX=$(date +%Y-%m-%d-%H-%M-%S)
            RELEASE_NAME="${DATE_PREFIX}-${NEXT_SEQ}"
            NEW_RELEASE="${RELEASES_PATH}/${RELEASE_NAME}"

            echo "📦 Nova release será: ${RELEASE_NAME}"

            sudo mkdir -p "${NEW_RELEASE}"
            sudo unzip -oq /tmp/blink-deploy-${ENV_LABEL}.zip -d "${NEW_RELEASE}"
            
            echo "⚙️ Configurando o Docker Compose correto (${ENV_LABEL})..."
            cd "${NEW_RELEASE}"
            sudo chown -R ubuntu:ubuntu "${NEW_RELEASE}"

            if [ "${ENV_LABEL}" = "prod" ]; then
              if [ -f docker-compose.prod.yml ]; then
                cp docker-compose.prod.yml docker-compose.yml
              fi
            else
              if [ -f docker-compose.hom.yml ]; then
                cp docker-compose.hom.yml docker-compose.yml
              fi
            fi

            echo "🛑 Parando containers antigos..."
            if [ -e "${CURRENT_LINK}" ]; then
                cd "${CURRENT_LINK}"
                docker compose --env-file "${SHARED_PATH}/.env" down --remove-orphans || true
            fi

            docker rm -f \
                blink-${ENV_LABEL}-redis \
                blink-${ENV_LABEL}-psql \
                blink-${ENV_LABEL}-nginx \
                blink-${ENV_LABEL}-app 2>/dev/null || true

            echo "🖼️ Sincronizando uploads e links da nova release..."
            if [ -d "${NEW_RELEASE}/storage/app/public" ]; then
                sudo cp -R "${NEW_RELEASE}/storage/app/public/." "${SHARED_PATH}/storage/app/public/" || true
            fi

            sudo rm -rf "${NEW_RELEASE}/storage"
            sudo ln -sfn "${SHARED_PATH}/storage" "${NEW_RELEASE}/storage"
            sudo chmod -R 777 "${SHARED_PATH}/storage"
            sudo chown -R ubuntu:www-data "${SHARED_PATH}/storage"

            sudo ln -sfn "${SHARED_PATH}/.env" "${NEW_RELEASE}/.env"
            sudo rm -rf "${NEW_RELEASE}/public/storage"
            sudo ln -sfn "${SHARED_PATH}/storage/app/public" "${NEW_RELEASE}/public/storage"

            sudo chown -R ubuntu:www-data "${NEW_RELEASE}"
            if [ -d "${NEW_RELEASE}/bootstrap/cache" ]; then
                sudo chmod -R 777 "${NEW_RELEASE}/bootstrap/cache"
            fi

            echo "🐳 Subindo containers Docker na NEW_RELEASE..."
            cd "${NEW_RELEASE}"

            if [ -f docker-compose.yml ]; then
              sudo docker network create blink-${ENV_LABEL}-net 2>/dev/null || true
              sudo docker volume create blink-${ENV_LABEL}-pgsql-data 2>/dev/null || true
              sudo docker volume create blink-${ENV_LABEL}-redis-data 2>/dev/null || true

              docker compose \
                --env-file "${SHARED_PATH}/.env" \
                up -d --build --remove-orphans
            else
              echo "❌ Erro: docker-compose.yml não encontrado!"
              exit 1
            fi

            echo "🛠️ Ajustando permissões internas dos containers..."
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app chmod 777 /tmp
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app chown -R www-data:www-data storage bootstrap/cache
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app chmod -R 777 storage bootstrap/cache

            echo "🗄️ Executando migrations e seeds..."
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan migrate --force
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan db:seed --force

            echo "⚡ Gerando caches do Laravel..."
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan optimize:clear
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan config:cache
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan route:cache
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan view:cache

            echo "=========================================="
            echo "🔀 REALIZANDO SWAP ATÔMICO"

            # Proteção contra pasta 'current' física/corrompida
            if [ -d "${CURRENT_LINK}" ] && [ ! -L "${CURRENT_LINK}" ]; then
              echo "⚠️ Removendo diretório 'current' físico antigo..."
              sudo rm -rf "${CURRENT_LINK}"
            fi

            sudo ln -sfn "${NEW_RELEASE}" "${CURRENT_LINK}"

            echo "Release ativa atualizada para: $(readlink -f "${CURRENT_LINK}")"
            echo "=========================================="

            echo "🧹 Limpando releases antigas (mantendo as 5 mais recentes)..."
            cd "${RELEASES_PATH}"
            CURRENT_ACTIVE_PATH=$(readlink -f "${CURRENT_LINK}" || true)

            ls -1dt */ 2>/dev/null | tail -n +6 | while read -r dir; do
              dir_clean="${dir%/}"
              FULL_DIR_PATH="${RELEASES_PATH}/${dir_clean}"

              if [ -n "${dir_clean}" ] && [ "${FULL_DIR_PATH}" != "${CURRENT_ACTIVE_PATH}" ]; then
                echo "🗑️ Removendo release antiga: ${dir_clean}"
                sudo rm -rf "${FULL_DIR_PATH}"
              fi
            done

            sudo rm -f /tmp/blink-deploy-${ENV_LABEL}.zip
            echo "✅ Deploy concluído com sucesso!"
          EOF