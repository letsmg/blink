name: 🚀 Deploy resumido Blink

on:
  push:
    branches: [main, hom]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, gd, zip, pgsql

      - name: 📦 Install Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Build Frontend (Vite)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 🤐 Criar Pacote de Deploy
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x ".github/*" \
            -x "tests/*" \
            -x ".env*" \
            -x "storage/framework/*" \
            -x "storage/logs/*"

      - name: 🔑 Configure SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: 🚀 Deploy Atômico com Versões Sequenciais
        run: |
          SERVER_IP="${{ secrets.SERVER_IP }}"
          BRANCH_NAME="${{ github.ref_name }}"

          if [ "$BRANCH_NAME" = "main" ]; then
            TARGET_ROOT="/var/www/blink"
            ENV_LABEL="prod"
          else
            TARGET_ROOT="/var/www/blink-hom"
            ENV_LABEL="hom"
          fi

          echo "Target Path: $TARGET_ROOT (Branch: $BRANCH_NAME)"

          scp -o StrictHostKeyChecking=no deploy.zip ubuntu@$SERVER_IP:/tmp/blink-deploy-${ENV_LABEL}.zip

          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_IP "TARGET_ROOT='${TARGET_ROOT}' ENV_LABEL='${ENV_LABEL}' bash -s" << 'EOF'
            set -e

            ROOT_PATH="${TARGET_ROOT}"
            RELEASES_PATH="${ROOT_PATH}/releases"
            SHARED_PATH="${ROOT_PATH}/shared"

            # 1. Validação inicial e estrutura compartilhada
            if [ ! -f "${SHARED_PATH}/.env" ]; then
              echo "❌ Arquivo shared/.env não encontrado em ${SHARED_PATH}"
              exit 1
            fi

            sudo mkdir -p "${RELEASES_PATH}" "${SHARED_PATH}/storage"/{app/public,framework/{cache,sessions,views},logs}

            # 2. Cálculo sequencial da versão
            cd "${RELEASES_PATH}"
            LAST_SEQ=$(find . -maxdepth 1 -mindepth 1 -type d | sed 's#^\./##' | grep -E -- '-[0-9]{3}$' | awk -F'-' '{print $(NF)}' | sort -n | tail -1)
            LAST_SEQ=${LAST_SEQ:-000}
            NEXT_SEQ=$(printf "%03d" $((10#${LAST_SEQ} + 1)))
            RELEASE_NAME="$(date +%Y-%m-%d-%H-%M-%S)-${NEXT_SEQ}"
            NEW_RELEASE="${RELEASES_PATH}/${RELEASE_NAME}"

            echo "📦 Nova release criada: ${RELEASE_NAME} (Ambiente: ${ENV_LABEL})"

            # 3. Extração e seleção do docker-compose
            sudo mkdir -p "${NEW_RELEASE}"
            sudo unzip -oq /tmp/blink-deploy-${ENV_LABEL}.zip -d "${NEW_RELEASE}"
            sudo rm -f /tmp/blink-deploy-${ENV_LABEL}.zip

            cd "${NEW_RELEASE}"
            sudo chown -R ubuntu:ubuntu "${NEW_RELEASE}"

            if [ "${ENV_LABEL}" = "prod" ] && [ -f docker-compose.prod.yml ]; then
              cp docker-compose.prod.yml docker-compose.yml
            elif [ -f docker-compose.hom.yml ]; then
              cp docker-compose.hom.yml docker-compose.yml
            fi

            # 4. Parar containers anteriores
            if [ -L "${ROOT_PATH}/current" ]; then
              cd "${ROOT_PATH}/current"
              docker compose --env-file "${SHARED_PATH}/.env" down --remove-orphans || true
            fi
            docker rm -f blinkapp-${ENV_LABEL} blink-${ENV_LABEL}-app blink-${ENV_LABEL}-redis blink-${ENV_LABEL}-psql blink-${ENV_LABEL}-nginx 2>/dev/null || true

            # 5. Sincronização e Symlinks
            if [ -d "${NEW_RELEASE}/storage/app/public" ]; then
              sudo cp -R "${NEW_RELEASE}/storage/app/public/." "${SHARED_PATH}/storage/app/public/" || true
            fi

            sudo rm -rf "${NEW_RELEASE}/storage" "${NEW_RELEASE}/public/storage"
            sudo ln -sfn "${SHARED_PATH}/storage" "${NEW_RELEASE}/storage"
            sudo ln -sfn "${SHARED_PATH}/storage/app/public" "${NEW_RELEASE}/public/storage"
            sudo ln -sfn "${SHARED_PATH}/.env" "${NEW_RELEASE}/.env"

            # 6. Permissões unificadas no Host
            sudo chown -R ubuntu:www-data "${NEW_RELEASE}" "${SHARED_PATH}/storage"
            sudo chmod -R 777 "${SHARED_PATH}/storage" "${NEW_RELEASE}/bootstrap/cache" 2>/dev/null || true

            # 7. Swap Atômico (Feito ANTES de subir o docker)
            echo "🔀 Trocando ponteiro da versão atual (Swap Atômico)..."
            sudo ln -sfn "${NEW_RELEASE}" "${ROOT_PATH}/current"

            # 8. Docker Build & Up
            cd "${ROOT_PATH}/current"
            sudo docker network create blink-${ENV_LABEL}-net 2>/dev/null || true
            sudo docker volume create blink-${ENV_LABEL}-pgsql-data 2>/dev/null || true
            sudo docker volume create blink-${ENV_LABEL}-redis-data 2>/dev/null || true

            docker compose --env-file "${SHARED_PATH}/.env" up -d --build --remove-orphans

            # 9. Comandos internos do Laravel (usando -T e com || true)
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app chmod 777 /tmp || true
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app chown -R www-data:www-data storage bootstrap/cache || true
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app chmod -R 777 storage bootstrap/cache || true

            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan migrate --force || true
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan db:seed --force || true
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan optimize:clear || true
            docker compose --env-file "${SHARED_PATH}/.env" exec -T app php artisan optimize || true

            # 10. Limpeza de Releases antigas (Mantendo as 5 mais recentes)
            cd "${RELEASES_PATH}"
            CURRENT_ACTIVE=$(readlink -f "${ROOT_PATH}/current" || true)
            ls -1dt */ 2>/dev/null | tail -n +6 | while read -r dir; do
              FULL_PATH="${RELEASES_PATH}/${dir%/}"
              if [ "${FULL_PATH}" != "${CURRENT_ACTIVE}" ]; then
                sudo rm -rf "${FULL_PATH}"
              fi
            done
            echo "🎉 Deploy do Blink concluído com sucesso!"
          EOF