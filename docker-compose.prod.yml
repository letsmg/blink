services:
  app:
    build:
      context: ${RELEASE_PATH}
      dockerfile: Dockerfile
    image: ${PROJECT_NAME:-blink-prod}-app:${IMAGE_TAG:-latest}
    restart: always
    working_dir: /var/www

    env_file:
      - ${SHARED_DIR}/.env

    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

    volumes:
      - storage-data:/var/www/storage

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: ${PROJECT_NAME:-blink-prod}-app:${IMAGE_TAG:-latest}
    restart: always
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${APP_PORT:-8012}:80"

    env_file:
      - ${SHARED_DIR}/.env

    volumes:            
      - storage-data:/var/www/storage

    depends_on:
      - app

    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgsql:
    image: postgres:16-alpine
    restart: always
    env_file:
      - ${SHARED_DIR}/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-blink_prod}
      POSTGRES_USER: ${DB_USERNAME:-blink_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-blink_user} -d ${DB_DATABASE:-blink_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: ${DOCKER_NETWORK:-blink-prod-net}
    external: true

volumes:
  storage-data:
    external: true
    name: ${PROJECT_NAME:-blink-prod}-storage-data
  pgsql-data:
    external: true
    name: ${PROJECT_NAME:-blink-prod}-pgsql-data
  redis-data:
    external: true
    name: ${PROJECT_NAME:-blink-prod}-redis-data