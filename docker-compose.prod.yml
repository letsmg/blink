name: blink-prod

services:
  app:
    container_name: ${PROJECT_NAME:-blink-prod}-app
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PROJECT_NAME:-blink-prod}-app:latest
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www      
      - ../../shared/storage:/var/www/storage
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/blink.ini:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-blink_db}
      - DB_USERNAME=${DB_USERNAME:-blink_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - CACHE_STORE=${CACHE_STORE:-redis}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME:-blink-prod}-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8011}:80"
    volumes:
      - .:/var/www:ro
      - ../../shared/storage:/var/www/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pgsql:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-blink-prod}-psql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-blink_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-blink_db}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_EXTERNAL:-5452}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-blink_user} -d ${DB_DATABASE:-blink_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-blink-prod}-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      ${REDIS_PASSWORD:+"--requirepass ${REDIS_PASSWORD}"}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT_EXTERNAL:-6383}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgsql-data:
    name: ${VOLUME_PGSQL:-blink-prod-pgsql-data}
  redis-data:
    name: ${VOLUME_REDIS:-blink-prod-redis-data}

networks:
  default:
    name: ${DOCKER_NETWORK:-blink-prod-net}