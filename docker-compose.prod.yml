services:
  app:
    container_name: ${PROJECT_NAME:-blink-prod}-app
    # Em PRODUÇÃO: Sem instrução 'build:'. A imagem é exclusivamente puxada da Registry via CI/CD.
    # Exemplo de tag versionada: blink-app:v1.0.4 ou blink-app:a1b2c3d
    image: ${REGISTRY_IMAGE:-ghcr.io/seu-usuario/blink-app}:${IMAGE_TAG}
    restart: unless-stopped
    working_dir: /var/www

    # Injeta todas as variáveis de ambiente do host no container da aplicação (PHP-FPM)
    env_file:
      - ../shared/.env

    # Em Produção, migrações automáticas no boot ficam desativadas por padrão.
    # Elas devem ser disparadas explicitamente via Job no CI/CD ou chaveadas via .env quando necessário.
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}

    volumes:
      # Uploads/Mídias persistentes
      - storage-data:/var/www/storage

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    container_name: ${PROJECT_NAME:-blink-prod}-nginx
    # Reutiliza EXATAMENTE a mesma imagem publicada no registry
    image: ${REGISTRY_IMAGE:-ghcr.io/seu-usuario/blink-app}:${IMAGE_TAG}
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${APP_PORT:-8012}:80"

    # ⚠️ Sem env_file aqui: O Nginx apenas serve arquivos estáticos e repassa requisições para o PHP-FPM
    
    volumes:
      - storage-data:/var/www/storage

    depends_on:
      - app

  pgsql:
    container_name: ${PROJECT_NAME:-blink-prod}-pgsql
    # Versão travada em paridade com todos os ambientes
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../shared/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-blink_prod}
      POSTGRES_USER: ${DB_USERNAME:-blink_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-blink_user} -d ${DB_DATABASE:-blink_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: ${PROJECT_NAME:-blink-prod}-redis
    # Versão travada na versão major 7 para estabilidade total
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

#
# Redes previsíveis para faciliatção de comunicação e depuração
#
networks:
  default:
    name: ${DOCKER_NETWORK:-blink-prod-net}

#
# Volumes protegidos contra deleção acidental via `docker compose down -v`
#
volumes:
  storage-data:
    external: true
    name: ${PROJECT_NAME:-blink-prod}-storage-data
  pgsql-data:
    external: true
    name: ${PROJECT_NAME:-blink-prod}-pgsql-data
  redis-data:
    external: true
    name: ${PROJECT_NAME:-blink-prod}-redis-data