services:
  app:
    container_name: ${PROJECT_NAME:-blink-hom}-app
    build:
      context: ${CURRENT_LINK:-../current}
      dockerfile: Dockerfile
    image: ${PROJECT_NAME:-blink-hom}-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    working_dir: /var/www

    # Injeta as variáveis de ambiente do host no container da aplicação (PHP-FPM)
    env_file:
      - ../shared/.env

    # Permite sobrescrever se as migrations devem rodar no boot via .env
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

    volumes:
      # Uploads/Mídias persistentes
      - storage-data:/var/www/storage

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    container_name: ${PROJECT_NAME:-blink-hom}-nginx
    # Reutiliza a mesma imagem imutável
    image: ${PROJECT_NAME:-blink-hom}-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${APP_PORT:-8011}:80"

    # ⚠️ Sem env_file aqui: O Nginx serve estáticos/proxy sem precisar de credenciais de banco ou APP_KEY

    volumes:
      - storage-data:/var/www/storage

    depends_on:
      - app

  pgsql:
    container_name: ${PROJECT_NAME:-blink-hom}-pgsql
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../shared/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-blink_hom}
      POSTGRES_USER: ${DB_USERNAME:-blink_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-blink_user} -d ${DB_DATABASE:-blink_hom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: ${PROJECT_NAME:-blink-hom}-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: ${DOCKER_NETWORK:-blink-hom-net}

volumes:
  storage-data:
    external: true
    name: ${PROJECT_NAME:-blink-hom}-storage-data
  pgsql-data:
    external: true
    name: ${PROJECT_NAME:-blink-hom}-pgsql-data
  redis-data:
    external: true
    name: ${PROJECT_NAME:-blink-hom}-redis-data