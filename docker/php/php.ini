[PHP]
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20
default_socket_timeout = 60

[Date]
date.timezone = America/Sao_Paulo

[Session]
session.save_handler = files
session.save_path = "/tmp"

[Opcache]
opcache.enable = 0
opcache.enable_cli = 0