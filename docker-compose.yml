services:
  # =============================================
  # Jitsi Meet - Servidor de teleatendimento (videochamadas E2E)
  # =============================================
  jitsi-web:
    image: jitsi/web:stable-9457
    container_name: ${COMPOSE_PROJECT_NAME:-blink}_jitsi_web
    restart: unless-stopped
    ports:
      - "${JITSI_HTTP_PORT:-8080}:80"
      - "${JITSI_HTTPS_PORT:-8443}:443"
    volumes:
      - jitsi_web_config:/config
      - jitsi_web_transcripts:/usr/share/jitsi-meet/transcripts
    environment:
      - XMPP_SERVER=jitsi-prosody
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - PUBLIC_URL=${JITSI_PUBLIC_URL:-http://localhost:8080}
      - JIBRI_RECORDER_PASSWORD=${JITSI_JIBRI_RECORDER_PASSWORD:-recorderpass}
      - JIBRI_XMPP_USER=jibri
      - JVB_XMPP_USER=jvb
      - ENABLE_COLIBRI_WEBSOCKET=1
      - TZ=America/Sao_Paulo
    networks:
      - app_network
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb

  jitsi-prosody:
    image: jitsi/prosody:stable-9457
    container_name: ${COMPOSE_PROJECT_NAME:-blink}_jitsi_prosody
    restart: unless-stopped
    volumes:
      - jitsi_prosody_config:/config
      - jitsi_prosody_plugins:/prosody-plugins-custom
    environment:
      - AUTH_TYPE=internal
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JITSI_JIBRI_XMPP_PASSWORD:-jibripass}
      - JIBRI_RECORDER_PASSWORD=${JITSI_JIBRI_RECORDER_PASSWORD:-recorderpass}
      - JIBRI_RECORDER_USER=recorder
      - JVB_XMPP_USER=jvb
      - JVB_XMPP_PASSWORD=${JITSI_JVB_XMPP_PASSWORD:-jvbpass}
      - JWT_APP_ID=${JITSI_JWT_APP_ID:-blink_app}
      - JWT_APP_SECRET=${JITSI_JWT_APP_SECRET:-blink_jitsi_secret_change_me}
      - ENABLE_AUTH=1
      - TZ=America/Sao_Paulo
    networks:
      - app_network

  jitsi-jicofo:
    image: jitsi/jicofo:stable-9457
    container_name: ${COMPOSE_PROJECT_NAME:-blink}_jitsi_jicofo
    restart: unless-stopped
    volumes:
      - jitsi_jicofo_config:/config
    environment:
      - XMPP_SERVER=jitsi-prosody
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - JIBRI_RECORDER_PASSWORD=${JITSI_JIBRI_RECORDER_PASSWORD:-recorderpass}
      - JIBRI_XMPP_USER=jibri
      - JVB_XMPP_USER=jvb
      - JWT_APP_ID=${JITSI_JWT_APP_ID:-blink_app}
      - JWT_APP_SECRET=${JITSI_JWT_APP_SECRET:-blink_jitsi_secret_change_me}
      - TZ=America/Sao_Paulo
    networks:
      - app_network
    depends_on:
      - jitsi-prosody

  jitsi-jvb:
    image: jitsi/jvb:stable-9457
    container_name: ${COMPOSE_PROJECT_NAME:-blink}_jitsi_jvb
    restart: unless-stopped
    ports:
      - "${JITSI_JVB_PORT:-10000}:10000/udp"
    volumes:
      - jitsi_jvb_config:/config
    environment:
      - XMPP_SERVER=jitsi-prosody
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JVB_XMPP_USER=jvb
      - JVB_XMPP_PASSWORD=${JITSI_JVB_XMPP_PASSWORD:-jvbpass}
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - TZ=America/Sao_Paulo
    networks:
      - app_network
    depends_on:
      - jitsi-prosody

  # =============================================
  # PostgreSQL - Banco de dados principal
  # =============================================
  pgsql:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-blink}_pgsql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================
  # Redis - Cache, filas e sessões
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-blink}_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================
  # Aplicação Laravel (desenvolvimento)
  # =============================================
  blink_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-blink}_app
    restart: unless-stopped
    working_dir: /var/www/blink
    volumes:
      - .:/var/www/blink
      - app_storage:/var/www/blink/storage
    ports:
      - "${APP_PORT_EXTERNAL:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: pgsql
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    command: >
      sh -c "
        php artisan migrate:fresh --seed --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

volumes:
  pgsql_data:
  redis_data:
  app_storage:
  jitsi_web_config:
  jitsi_web_transcripts:
  jitsi_prosody_config:
  jitsi_prosody_plugins:
  jitsi_jicofo_config:
  jitsi_jvb_config:

networks:
  app_network:
    driver: bridge