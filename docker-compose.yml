services:
  app:
    container_name: blinkapp-dev
    build:
      context: .
      dockerfile: Dockerfile
    image: blinkapp-dev:latest
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/blink.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_HOST=blink-psql-dev
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-blink_db}
      - DB_USERNAME=${DB_USERNAME:-blink_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=blink-redis-dev
      - REDIS_PORT=6379
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - CACHE_STORE=${CACHE_STORE:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blink-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: blink-nginx-dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - blink-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pgsql:
    image: postgres:16-alpine
    container_name: blink-psql-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-blink_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-blink_db}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_EXTERNAL:-5450}:5432"
    networks:
      - blink-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-blink_user} -d ${DB_DATABASE:-blink_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blink-redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      ${REDIS_PASSWORD:+"--requirepass ${REDIS_PASSWORD}"}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT_EXTERNAL:-6400}:6379"
    networks:
      - blink-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgsql-data:
    #external: true
    name: blink-pgsql-data-dev
  redis-data:
    #external: true
    name: blink-redis-data-dev

networks:
  blink-net:
    #external: true
    name: blink-net-dev